<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D91" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Campanha" />
  <meta name="description" content="Controle de entrega de materiais de campanha" />
  <title>Campanha · Materiais</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef3fc',
              100: '#d5e2f7',
              200: '#adc6ee',
              500: '#2b63c4',
              700: '#0e4aa8',
              800: '#0B3D91',
              900: '#082c6b',
              950: '#061c45'
            },
            gold: { 400: '#e3c15a', 500: '#d4a017', 600: '#b8860b' }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'Segoe UI', 'sans-serif']
          },
          boxShadow: {
            card: '0 8px 24px -12px rgba(8, 44, 107, 0.18)',
            nav:  '0 -8px 24px -12px rgba(8, 44, 107, 0.16)'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chosen/1.8.7/chosen.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <section id="tela-login" class="fixed inset-0 z-40 flex flex-col bg-brand-950 lg:flex-row lg:bg-slate-100"></section>

  <section id="tela-app" class="hidden fixed inset-0 z-10 flex min-h-0 flex-col bg-slate-100 lg:flex-row">
    <aside id="sidebar" class="hidden w-64 shrink-0 flex-col bg-brand-900 text-white lg:flex">
      <div class="safe-top px-5 pb-4 pt-5">
        <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-gold-400">Campanha</p>
        <h1 class="mt-1 text-xl font-extrabold tracking-tight">Materiais</h1>
      </div>
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto px-3 pb-4"></nav>
      <div class="mt-auto border-t border-white/10 px-4 py-4">
        <p id="sidebar-user" class="truncate text-sm font-semibold text-white/90">—</p>
        <p id="sidebar-versao" class="mt-1 text-[11px] text-white/40"></p>
        <button type="button" id="btn-sair-sidebar" class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-white/10 py-2.5 text-sm font-bold hover:bg-white/15">
          Sair
        </button>
      </div>
    </aside>

    <div class="flex min-h-0 min-w-0 flex-1 flex-col">
      <header class="safe-top z-20 border-b border-slate-200/80 bg-brand-800 text-white lg:bg-white lg:text-slate-800">
        <div class="flex items-center justify-between px-4 py-3 lg:px-8">
          <div class="flex min-w-0 items-center gap-3">
            <button type="button" id="btn-mostrar-menu" class="hidden h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-white/10 text-white lg:bg-slate-100 lg:text-brand-800" aria-label="Mostrar menu">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="min-w-0">
              <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-gold-400 lg:text-brand-700">Campanha</p>
              <h2 id="titulo-view" class="truncate text-lg font-extrabold leading-tight lg:text-2xl">Entregas</h2>
              <p id="subtitulo-view" class="hidden text-sm text-slate-500 lg:block"></p>
            </div>
          </div>
          <div class="flex items-center gap-2 lg:hidden">
            <button type="button" data-instalar-app class="hidden h-11 rounded-2xl bg-white/10 px-3 text-xs font-bold" aria-label="Instalar no celular">
              Instalar
            </button>
            <div class="max-w-[42vw] truncate rounded-full bg-white/10 px-3 py-1.5 text-xs font-semibold">
              <span id="nome-usuario">—</span>
            </div>
            <button type="button" id="btn-sair" class="flex h-11 w-11 items-center justify-center rounded-2xl bg-white/10" aria-label="Sair">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="conteudo" class="app-scroll flex-1 px-4 pb-28 pt-4 lg:px-8 lg:pb-8 lg:pt-6"></main>

      <nav id="nav-inferior" class="safe-bottom fixed bottom-0 left-0 right-0 z-30 border-t border-slate-200 bg-white shadow-nav lg:hidden">
        <div id="nav-itens" class="mx-auto flex max-w-lg items-stretch justify-around px-2 pt-1"></div>
      </nav>
    </div>
  </section>

  <div id="sheet-cadastros" class="fixed inset-0 z-50 hidden lg:hidden">
    <div id="sheet-backdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="sheet-enter absolute bottom-0 left-0 right-0 rounded-t-3xl bg-white p-5 pb-8">
      <div class="mx-auto mb-4 h-1.5 w-12 rounded-full bg-slate-200"></div>
      <h3 class="mb-4 text-lg font-extrabold">Cadastros</h3>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" class="cad-item flex min-h-[88px] flex-col items-start justify-center rounded-2xl bg-brand-50 p-4 text-left" data-goto="usuarios">
          <span class="text-sm font-extrabold text-brand-900">Usuários</span>
          <span class="text-xs text-slate-500">Login e permissões</span>
        </button>
        <button type="button" class="cad-item flex min-h-[88px] flex-col items-start justify-center rounded-2xl bg-brand-50 p-4 text-left" data-goto="colaboradores">
          <span class="text-sm font-extrabold text-brand-900">Colaboradores</span>
          <span class="text-xs text-slate-500">Endereço e folha</span>
        </button>
        <button type="button" class="cad-item flex min-h-[88px] flex-col items-start justify-center rounded-2xl bg-brand-50 p-4 text-left" data-goto="materiais">
          <span class="text-sm font-extrabold text-brand-900">Materiais</span>
          <span class="text-xs text-slate-500">Nome e tipo</span>
        </button>
        <button type="button" class="cad-item flex min-h-[88px] flex-col items-start justify-center rounded-2xl bg-brand-50 p-4 text-left" data-goto="tipos">
          <span class="text-sm font-extrabold text-brand-900">Tipos</span>
          <span class="text-xs text-slate-500">Santinho, bandeira…</span>
        </button>
      </div>
    </div>
  </div>

  <div id="modal-confirm" class="fixed inset-0 z-[60] hidden items-center justify-center p-6">
    <div class="absolute inset-0 bg-black/40" data-close-confirm></div>
    <div class="relative w-full max-w-sm rounded-3xl bg-white p-5 shadow-card">
      <p id="confirm-texto" class="text-base font-semibold text-slate-800">Confirmar?</p>
      <div class="mt-5 flex gap-2">
        <button type="button" id="confirm-nao" class="min-h-[48px] flex-1 rounded-2xl bg-slate-100 font-bold text-slate-600">Cancelar</button>
        <button type="button" id="confirm-sim" class="min-h-[48px] flex-1 rounded-2xl bg-red-600 font-bold text-white">Excluir</button>
      </div>
    </div>
  </div>

  <div id="pwa-ios-ajuda" class="fixed inset-0 z-[70] hidden items-center justify-center p-6">
    <div class="absolute inset-0 bg-black/40" data-close-ios-pwa></div>
    <div class="relative w-full max-w-sm rounded-3xl bg-white p-5 shadow-card">
      <p class="text-base font-extrabold text-slate-800">Instalar no iPhone</p>
      <ol class="mt-3 list-decimal space-y-2 pl-5 text-sm text-slate-600">
        <li>Abra este site no <strong>Safari</strong>.</li>
        <li>Toque no botão de <strong>compartilhar</strong> (quadrado com seta).</li>
        <li>Escolha <strong>Adicionar à Tela de Início</strong>.</li>
        <li>Confirme em <strong>Adicionar</strong>.</li>
      </ol>
      <button type="button" data-close-ios-pwa class="btn-primary mt-5 w-full">Entendi</button>
    </div>
  </div>

  <div id="loading" class="fixed inset-0 z-[80] hidden items-center justify-center bg-brand-950/40">
    <div class="flex items-center gap-3 rounded-2xl bg-white px-5 py-4 shadow-card">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-brand-800 border-t-transparent"></span>
      <span class="text-sm font-bold">Carregando…</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chosen/1.8.7/chosen.jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
  <script src="env.js"></script>
  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/supabase.js"></script>
  <script src="js/core/utils.js?v=4"></script>
  <script src="js/core/ui.js?v=2"></script>
  <script src="js/core/chosen.js"></script>
  <script src="js/core/bancos.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/nav.js?v=4"></script>
  <script src="js/core/pwa.js"></script>
  <script src="js/core/ocr.js?v=1"></script>
  <script src="js/core/localidades.js?v=1"></script>
  <script src="js/areas/login.js"></script>
  <script src="js/areas/entregas.js?v=18"></script>
  <script src="js/areas/relatorios.js?v=2"></script>
  <script src="js/areas/folha.js?v=1"></script>
  <script src="js/areas/usuarios.js"></script>
  <script src="js/areas/colaboradores.js?v=7"></script>
  <script src="js/areas/materiais.js"></script>
  <script src="js/areas/tipos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
